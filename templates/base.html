<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>{% block title %}In4matika - Tavola Periodica Elementi{% endblock %}</title>
  
  <!-- CSS ORIGINALE DI TAPE4EL -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  
  <!-- CSS PER L'HEADER UNIFICATO -->
  <style>
    /* Header principale */
    .brand-header { 
        background-color: #8e9598; 
        width: 100%;
        position: relative;
        z-index: 1000;
    }

    .brand-header-inner {
        display: flex; 
        align-items: center; 
        justify-content: space-between; /* Spinge i loghi a sinistra e i menu a destra */
        width: min(1300px, calc(100% - 40px)); /* Allargato per far stare tutto */
        min-height: 96px; 
        margin-inline: auto;
        gap: 20px;
    }
    
    /* 1. Logo In4matika (a sinistra) */
    .brand-home { 
        display: inline-flex; 
        align-items: center; 
        text-decoration: none; 
    }
    .logo-in4matika {
        display: block; 
        width: min(200px, 40vw); 
        max-height: 60px; 
        object-fit: contain; 
    }

    /* 2. Area Destra: Atomo + Home + Menu */
    .header-nav-group {
        display: flex;
        align-items: center;
        gap: 25px; /* Spazio tra i blocchi */
    }

    /* Logo Atomo + Tape4el */
    .brand-tape4el { 
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none; 
    }
    .logo-atomo {
        width: 38px;
        height: 38px;
    }
    .tape4el-text {
        display: flex;
        flex-direction: column;
        color: #1e3a4a;
        font-weight: 700;
        font-size: 1.1rem;
        line-height: 1.1;
    }
    .tape4el-text small {
        font-size: 0.7rem;
        font-weight: 400;
        opacity: 0.8;
    }

    /* Pulsante Home */
    .home-link {
        padding: 8px 16px; 
        color: #344b59; 
        border: 1px solid rgba(71, 98, 113, 0.4);
        border-radius: 5px; 
        background: rgba(255, 255, 255, 0.3); 
        font-size: 0.9rem;
        font-weight: 700; 
        text-decoration: none; 
        white-space: nowrap;
    }
    .home-link:hover { 
        background: rgba(255, 255, 255, 0.7); 
    }

    /* Menu di navigazione */
    .nav-links {
        display: flex;
        align-items: center;
        gap: 15px;
    }
    .nav-links a {
        color: #1e3a4a;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.95rem;
        white-space: nowrap;
    }
    .nav-links a:hover {
        text-decoration: underline;
    }
    
    /* Adattamento per schermi piccoli */
    @media (max-width: 900px) {
        .brand-header-inner {
            flex-direction: column;
            padding: 15px 0;
            gap: 15px;
        }
        .header-nav-group {
            flex-wrap: wrap;
            justify-content: center;
        }
    }
  </style>
</head>
<body>

  <!-- UNICO HEADER -->
  <header class="brand-header">
    <div class="brand-header-inner">
      
      <!-- SINISTRA: Logo In4matika -->
      <a class="brand-home" href="/" aria-label="Torna alla home di In4matika">
          <img class="logo-in4matika" src="/images/1024/28895174/logoinfo-l6FultudfmRI_eIFM5OQsg.png" alt="In4matika">
      </a>
      <!-- Logo Atomo + Tape4el -->
          <img class="logo-atomo" src="{{ url_for('assets', asset_type='config', filename='atomico.png') }}" alt="Atomo">
              <div class="tape4el-text">
                  <span>Tape4el</span>
              </div>
		
      <!-- DESTRA: Home, Menu -->
      <div class="header-nav-group">
                   
          <!-- Pulsante Home -->
          <a class="home-link" href="/">Home</a>
          
          <!-- Menu -->
          <nav class="nav-links" aria-label="Navigazione principale">
            <a href="{{ url_for('index') }}">Elementi</a>
            <a href="{{ url_for('calculator') }}">Massa molare</a>
            <a href="{{ url_for('compounds') }}">Composti</a>
            <a href="{{ url_for('about') }}">Informazioni</a>
          </nav>
          
      </div>

    </div>
  </header>

  <!-- CONTENUTO DELLA PAGINA -->
  <main class="page">
    {% block content %}
    {% endblock %}
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">Tape4el · Dati dal database SQLite del progetto</footer>
  
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
