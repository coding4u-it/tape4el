<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>{% block title %}Tavola periodica{% endblock %} · TavPerEle</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('index') }}">
      <img src="{{ url_for('assets', asset_type='config', filename='atomico.png') }}" alt="" width="42" height="42">
      <span>TavPerEle<small>La tavola periodica interattiva</small></span>
    </a>
    <nav aria-label="Navigazione principale">
      <a href="{{ url_for('index') }}">Elementi</a>
      <a href="{{ url_for('calculator') }}">Massa molare</a>
      <a href="{{ url_for('compounds') }}">Composti</a>
      <a href="{{ url_for('about') }}">Informazioni</a>
    </nav>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">TavPerEle · Dati dal database SQLite del progetto</footer>
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
